[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librofm-downloader"
version = "0.1.0"
description = "Download owned audiobooks from your Libro.fm account"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
librofm-downloader = "librofm_downloader.cli:run"

[tool.setuptools.packages.find]
include = ["librofm_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
